<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柴学園 経営ダッシュボード</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#f0f2f8; --surface:#fff; --surface2:#eef0f8; --border:#d0d6ea;
  --text-primary:#0d1a3a; --text-secondary:#2a3a60; --text-muted:#6070a0;
  --accent:#4169e1; --accent-light:#e8edfc;
  --accent2:#cc0000; --accent2-light:#fdecea;
  --warn:#b07d0a; --warn-light:#fdf7e8;
  --green:#1a6e32; --green-light:#e8f5ed;
  --mono:'DM Mono',monospace;
  --card-w:380px;
  --cards-per-view:3;
  --card-gap:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text-primary);font-size:14px;line-height:1.6;min-height:100vh}

/* ヘッダー */
.header{background:var(--accent);color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(65,105,225,0.3)}
.header-title{font-size:16px;font-weight:700;letter-spacing:.04em}
.header-sub{font-size:11px;opacity:.75;margin-top:2px}
.header-date{font-family:var(--mono);font-size:11px;opacity:.85;text-align:right}

/* メイン */
.main{max-width:1200px;margin:0 auto;padding:.75rem 1.5rem 3rem}
.section-label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:1rem 0 .5rem}

/* サマリー */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.125rem}
.metric-card.accent{background:var(--accent);border-color:transparent}
.metric-card.accent .metric-label{color:rgba(255,255,255,.65)}
.metric-card.accent .metric-value{color:#fff}
.metric-card.accent .metric-sub{color:rgba(255,255,255,.55)}
.metric-label{font-size:11px;color:var(--text-muted);margin-bottom:.3rem}
.metric-value{font-size:24px;font-weight:700;font-family:var(--mono);color:var(--text-primary);line-height:1.1}
.metric-value.positive{color:var(--accent)}
.metric-value.negative{color:var(--accent2)}
.metric-sub{font-size:11px;color:var(--text-muted);margin-top:.25rem}

/* 園スライダーエリア */
.slider-outer{position:relative;margin-bottom:1.5rem}
.slider-nav{display:flex;align-items:center;gap:20px;margin-bottom:1rem}
.progress-track{flex:1;height:3px;background:var(--border);border-radius:2px;position:relative;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
.slide-btn-group{display:flex;gap:10px;flex-shrink:0}
.slide-btn-circle{background:var(--accent);color:#fff;border:1.5px solid var(--accent);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s,filter .15s}
.slide-btn-circle:hover:not(:disabled){filter:brightness(1.1)}
.slide-btn-circle:disabled{opacity:.3;cursor:default}
.cards-viewport{overflow:hidden;border-radius:12px}
.cards-track{display:flex;transition:transform .35s ease;will-change:transform}

/* 3歳児基準 */
.r3-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:.75rem}
.r3-row label{font-size:11px;color:var(--text-muted)}
.select-inline{font-size:11px;padding:2px 6px;border-radius:4px;border:.5px solid var(--border);background:var(--surface);color:var(--text-primary);cursor:pointer}

/* 園カード */
.park-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;flex:0 0 var(--card-w);min-width:var(--card-w);max-width:var(--card-w)}
.park-card-head{padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.park-card-name{font-size:15px;font-weight:700;color:var(--text-primary)}
.park-card-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge-ok{background:var(--green-light);color:var(--green)}
.badge-warn{background:var(--warn-light);color:var(--warn)}
.badge-info{background:var(--accent-light);color:var(--accent)}
.badge-danger{background:var(--accent2-light);color:var(--accent2)}
.badge-empty{background:#f0f0f0;color:#999}
.park-card-body{padding:.875rem 1rem}

/* 空カード */
.park-card.empty .park-card-body{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--text-muted);font-size:12px;flex-direction:column;gap:8px}
.park-card.empty .empty-icon{font-size:2rem;opacity:.3}

/* 数値3列 */
.park-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.75rem}
.park-stat-val{font-size:17px;font-weight:700;font-family:var(--mono)}
.park-stat-val.positive{color:var(--accent)}
.park-stat-val.negative{color:var(--accent2)}
.park-stat-lbl{font-size:10px;color:var(--text-muted);margin-top:1px}
.act-table{width:100%;border-collapse:collapse;font-size:11px;margin:.1rem 0 .75rem}
.act-table th{font-weight:500;color:var(--text-muted);text-align:right;padding:3px 4px;border-bottom:1px solid var(--border)}
.act-table th:first-child,.act-table td:first-child{text-align:left}
.act-table td{text-align:right;padding:3px 4px;font-family:var(--mono);border-bottom:1px solid var(--border)}
.act-table tr:last-child td{border-bottom:none;color:var(--text-muted)}

/* 充足バー */
.capacity-bar{margin-top:.5rem}
.capacity-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-bottom:3px}
.capacity-bar-bg{background:var(--surface2);border-radius:3px;height:5px;overflow:hidden}
.capacity-bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .5s ease}
.divider{border:none;border-top:1px solid var(--border);margin:.625rem 0}

/* 年齢テーブル */
.age-table{width:100%;font-size:11px;border-collapse:collapse;margin-top:.5rem}
.age-table th{color:var(--text-muted);font-weight:400;padding:3px 4px 3px 0;text-align:right;border-bottom:1px solid var(--border)}
.age-table th:first-child{text-align:left}
.age-table td{padding:4px 4px 4px 0;text-align:right}
.age-table td:first-child{text-align:left;color:var(--text-secondary)}
.age-table .total-row td{border-top:1px solid var(--border);font-weight:500;padding-top:5px}

/* 職員配置 */
.staff-section{margin-top:.875rem;padding-top:.75rem;border-top:1px solid var(--border)}
.staff-title{font-size:11px;font-weight:500;color:var(--text-secondary);margin-bottom:.5rem;display:flex;align-items:center;gap:5px}
.staff-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:.5rem}
.staff-box{background:var(--surface2);border-radius:6px;padding:.5rem .625rem}
.staff-box-label{font-size:10px;color:var(--text-muted);margin-bottom:2px}
.staff-box-val{font-size:16px;font-weight:700;font-family:var(--mono)}
.staff-box-val.positive{color:var(--green)}
.staff-box-val.negative{color:var(--accent2)}
.staff-box-sub{font-size:10px;color:var(--text-muted);margin-top:1px}
.staff-bar-wrap{margin-top:.5rem}
.staff-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.staff-bar-lbl{font-size:10px;color:var(--text-muted);min-width:60px}
.staff-bar-bg{flex:1;background:var(--surface2);border-radius:3px;height:7px;overflow:hidden}
.staff-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.bar-req{background:#9ab8d8}
.bar-actual-ok{background:var(--green)}
.bar-actual-warn{background:#ffd700}
.bar-actual-danger{background:var(--accent2)}
.staff-bar-val{font-size:10px;font-family:var(--mono);min-width:28px;text-align:right;color:var(--text-secondary)}

/* 収支バー */
.balance-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.balance-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:.5rem}
.balance-bar-label{font-size:12px;color:var(--text-secondary);min-width:80px}
.balance-bar-bg{flex:1;background:var(--surface2);border-radius:3px;height:10px;overflow:hidden}
.balance-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.balance-bar-val{font-size:12px;font-family:var(--mono);min-width:90px;text-align:right;color:var(--text-primary)}
.bar-income{background:#2a5fc4}
.bar-labor{background:var(--accent)}
.bar-other{background:#c8a020}
.bar-surplus-pos{background:var(--green)}
.bar-surplus-neg{background:var(--accent2)}

/* 設定 */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.settings-group-title{font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:.625rem}
.slider-lbl{font-size:12px;color:var(--text-secondary);min-width:90px}
.slider-lbl.wide{min-width:120px}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer}
.slider-val{font-size:12px;font-family:var(--mono);font-weight:500;min-width:80px;text-align:right;color:var(--text-primary)}
.settings-note{font-size:10px;color:var(--text-muted);margin-top:.5rem;line-height:1.5}
.footer-note{font-size:11px;color:var(--text-muted);line-height:1.8;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)}
@media(max-width:900px){.summary-grid{grid-template-columns:repeat(2,1fr)}.settings-grid{grid-template-columns:1fr}}
</style>

.v3 .kf.l{text-align:left;margin-top:2px}
.v3 .klg{font-size:12px;margin-top:6px}
.v3 .note{font-size:12px;margin-top:6px}

.v3 details{padding:4px 0} .v3 summary{font-size:13px;cursor:pointer}
.v3 .tb{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.v3 .tb th{font-weight:400;text-align:right;border-bottom:1px solid var(--line);padding:2px 0}

.v3 .inv{display:inline-block;margin-top:6px;font-size:12px;color:#fff;text-decoration:none;background:var(--accent);border-radius:20px;padding:2px 10px}

const V3_COEF=1.8, V3_LABOR_TARGET=70;   // 適正上限＝国基準×1.8／人件費率の目安70%
const V3C=2*Math.PI*40;
function v3Donut(pct,color,center,mark){
  const dash=(pct==null?0:V3C*Math.min(pct,100)/100).toFixed(1);
  let tick='';
  if(mark!=null){ const a=(mark/100*360-90)*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
    tick=`<line x1="${(75+31*c).toFixed(1)}" y1="${(58+31*s).toFixed(1)}" x2="${(75+49*c).toFixed(1)}" y2="${(58+49*s).toFixed(1)}" stroke="var(--c-mark)" stroke-width="2.5"/>`; }
  return `<svg viewBox="0 0 150 106" width="100%" role="img">
   <circle cx="75" cy="58" r="40" fill="none" stroke="var(--s2)" stroke-width="13"/>
   <circle cx="75" cy="58" r="40" fill="none" stroke="${color}" stroke-width="13" stroke-dasharray="${dash} ${V3C.toFixed(1)}" transform="rotate(-90 75 58)"/>
   ${tick}<text x="75" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${center}</text></svg>`;
}
function v3Judge(v,base){ const up=Math.round(base*V3_COEF*10)/10;
  return v<base?['var(--c-ng)','国基準を下回る']:v<=up?['var(--c-labor)','適正範囲内']:['var(--c-over)',`適正を${Math.round((v-up)*10)/10}名超え`]; }
function v3Scale(m){ const up=m.base*V3_COEF; return Math.max(30, Math.ceil(Math.max(up, m.staff||0, m.fte||0)*1.1/10)*10); }
function v3Columns(v,base,label,max){
  max=max||30;
  const up=Math.round(base*V3_COEF*10)/10, Y0=105, K=90/max, none=(v==null), [col]=none?['']:v3Judge(v,base);
  const yB=Y0-base*K, yU=Y0-up*K, yV=none?Y0:Y0-Math.min(v,max)*K;
  const vt=none?`<text x="110" y="100" text-anchor="middle" font-size="12" fill="var(--ink)">—</text>`:(v<up&&up-v<max/10)?`<text x="110" y="${yV+14}" text-anchor="middle" font-size="12" fill="#fff">${v}</text>`

   <rect x="34" y="${yU}" width="36" height="${(up-base)*K}" fill="var(--c-ok)"/>
   <text x="52" y="${base*K>=16?yB+15:yB-4}" text-anchor="middle" font-size="12" fill="${base*K>=16?'#fff':'var(--ink)'}">${base}</text>
   <line x1="28" y1="${yU}" x2="134" y2="${yU}" stroke="var(--c-mark)" stroke-width="1.5" stroke-dasharray="4 3"/>
   <text x="52" y="${yU-4}" text-anchor="middle" font-size="12" fill="var(--ink)">${up}</text>
   ${none?'':`<rect x="92" y="${yV}" width="36" height="${(Y0-yV)}" fill="${col}"/>`}${vt}
   <text x="52" y="123" text-anchor="middle" font-size="12" fill="var(--ink)">国基準</text>
   <text x="110" y="123" text-anchor="middle" font-size="12" fill="var(--ink)">${label}</text></svg>`;

      <select id="${p.id}-ms" onchange="v3Show('${p.id}',this.value)">${opts}</select><div id="${p.id}-st"></div></div>
  </div><div class="park-card-body" id="${p.id}-v3b"></div>`;
}
function v3Show(id,key){
  const p=PARKS.find(x=>x.id===id); if(!p) return;
  document.getElementById(id+'-v3b').innerHTML=v3Body(p,key);
  document.getElementById(id+'-st').innerHTML=p.v3.months[key].kind==='k'?'<span class="tag t-kak">確定</span>':'<span class="tag t-sok">速報・経理待ち</span>';
}

// ===== カード生成 =====
const VISIBLE_COUNT=3;  // ビューポートに表示するカード枚数
const PER_VIEW=1;       // 1クリックで進むカード枚数

function buildCards(){
  const track=document.getElementById('cards-track');
  track.innerHTML='';

  PARKS.forEach((p,i)=>{
    // カード
    const card=document.createElement('div');
    card.className='park-card'+(p.hasData?'':' empty');
    card.id='card-'+p.id;

    const badgeClass=p.hasData?'badge-ok':'badge-empty';
    const badgeText=p.hasData?'データあり':'データ未登録';

    if(p.v3){
      card.className='park-card v3';
      card.innerHTML=v3Card(p);
    } else if(p.hasData){
      card.innerHTML=`
      <div class="park-card-head">
        <div>
          <div class="park-card-name">${p.label}</div>
          <div class="park-card-sub">${p.sub}</div>
        </div>
        <span class="badge ${badgeClass}" id="${p.id}-badge">${badgeText}</span>
      </div>
      <div class="park-card-body">
        ${p.actual?actualBlock(p):`<div class="park-stat-row">
          <div><div class="park-stat-val" id="${p.id}-income">—</div><div class="park-stat-lbl" id="${p.id}-income-lbl">${p.hasInvoice?'月次収入（実績）':'推計月次収入'}</div></div>
          <div><div class="park-stat-val" id="${p.id}-labor">—</div><div class="park-stat-lbl">推計人件費</div></div>
          <div><div class="park-stat-val" id="${p.id}-surplus">—</div><div class="park-stat-lbl">推計収支差</div></div>
        </div>`}
        ${p.hasInvoice?`<div style="font-size:10px;color:var(--accent);margin:-.4rem 0 .5rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="background:var(--accent-light);color:var(--accent);border-radius:4px;padding:1px 6px;font-weight:500">実績</span>
          <span style="color:var(--text-muted)">請求書ベース（${p.invoiceMonth}分）</span>
          ${isHonbuUnlocked() ? (p.invoiceUrl
            ? `<a href="${p.invoiceUrl}" target="_blank" rel="noopener" style="margin-left:auto;font-size:10px;color:#fff;text-decoration:none;background:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:2px 10px;white-space:nowrap">📄 請求書を開く</a>`
            : `<span style="margin-left:auto;font-size:10px;color:var(--text-muted);border:1px solid var(--border);border-radius:20px;padding:2px 10px;white-space:nowrap">📄 請求書未アップロード</span>`) : ''}
        </div>`:''}
        <div class="capacity-bar">
          <div class="capacity-bar-label"><span>在籍状況</span><span id="${p.id}-cap-label">—</span></div>
          <div class="capacity-bar-bg"><div class="capacity-bar-fill" id="${p.id}-cap-bar" style="width:0%"></div></div>
        </div>
        <hr class="divider">
        <table class="age-table">
          <tr><th>年齢</th><th>人数</th><th>単価</th><th>小計</th></tr>
          <tr id="${p.id}-r0"><td>0歳児</td><td>${p.age0}名</td><td>—</td><td>—</td></tr>
          <tr id="${p.id}-r12"><td>1・2歳児</td><td>${p.age1+p.age2}名</td><td>—</td><td>—</td></tr>
          <tr id="${p.id}-r35"><td>3〜5歳児</td><td>${p.age3+p.age4+p.age5}名</td><td>—</td><td>—</td></tr>
          <tr class="total-row"><td>合計</td><td id="${p.id}-total-n">—名</td><td></td><td id="${p.id}-total-val">—</td></tr>
        </table>
        <div class="staff-section">
          <div class="staff-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
            職員配置状況
          </div>
          <div class="staff-grid">
            <div class="staff-box">
              <div class="staff-box-label">在籍職員数</div>
              <div class="staff-box-val" id="${p.id}-staff-total">${p.staffTotal}名</div>
              <div class="staff-box-sub">${p.staffDesc}${('fte' in p)?`<br>常勤換算 ${p.fte!=null?p.fte+'名':'未登録'}`:''}</div>
            </div>
            <div class="staff-box">
              <div class="staff-box-label">適正範囲</div>
              <div class="staff-box-val" id="${p.id}-staff-range" style="font-size:13px">—</div>
              <div class="staff-box-sub">基準 <span id="${p.id}-staff-req">—</span>名 〜 上限 <span id="${p.id}-staff-max">—</span>名</div>
            </div>
          </div>
          <div class="staff-bar-wrap">
            <div class="staff-bar-row">
              <div class="staff-bar-lbl">最低必要</div>
              <div class="staff-bar-bg"><div class="staff-bar-fill bar-req" id="${p.id}-bar-req" style="width:0%"></div></div>
              <div class="staff-bar-val" id="${p.id}-bar-req-val">—</div>
            </div>
            <div class="staff-bar-row">
              <div class="staff-bar-lbl">在籍職員</div>
              <div class="staff-bar-bg"><div class="staff-bar-fill bar-actual-ok" id="${p.id}-bar-actual" style="width:0%"></div></div>
              <div class="staff-bar-val">${p.staffTotal}名</div>
            </div>
          </div>
        </div>
      </div>`;
    } else {
      card.innerHTML=`
      <div class="park-card-head">
        <div>
          <div class="park-card-name">${p.label}</div>
          <div class="park-card-sub">${p.sub}</div>
        </div>
        <span class="badge badge-empty">${badgeText}</span>
      </div>
      <div class="park-card-body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;gap:10px">
        <div style="font-size:2.5rem;opacity:.18">🏫</div>
        <div style="font-size:12px;color:var(--text-muted);text-align:center">
          コドモンCSVを読み込むと<br>データが表示されます
        </div>
      </div>`;
    }
    track.appendChild(card);
    if(p.v3) v3Show(p.id,p.v3.order[0]);
  });

  resizeViewport();
}

// ===== スライド制御 =====
let curIdx=0;


function getCardW(){
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-w'))||380;
}
function getGap(){
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-gap'))||14;
}
function maxIdx(){
  return Math.max(0, PARKS.length-VISIBLE_COUNT);
}

function resizeViewport(){
  const vp=document.getElementById('viewport');
  const track=document.getElementById('cards-track');
  if(!track.children.length)return;
  const gap=getGap();
  const cardW=getCardW();
  track.style.gap=gap+'px';
  // ビューポート幅 = カード3枚 + ギャップ2つ（表示枚数は常に3固定）
  vp.style.width=(cardW*VISIBLE_COUNT+gap*(VISIBLE_COUNT-1))+'px';
  goTo(curIdx,false);
}

function goTo(i, animate=true){
  const track=document.getElementById('cards-track');
  if(!track.children.length)return;
  const gap=getGap();
  const cardW=getCardW();
  const max=maxIdx();
  curIdx=Math.max(0,Math.min(i,max));
  track.style.transition=animate?'transform .35s ease':'none';
  // 1カードずつスライド
  track.style.transform=`translateX(-${curIdx*(cardW+gap)}px)`;

  // 進捗バー更新
  const pct=max>0?(curIdx/max*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('btn-prev').disabled=curIdx===0;
  document.getElementById('btn-next').disabled=curIdx===max;
}

function slide(dir){ goTo(curIdx+dir); }

// キーボード操作
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')slide(-1);
  if(e.key==='ArrowRight')slide(1);
});

// ===== 計算更新 =====
// ★「設定」欄を廃止（2026-10）。旧形式のカードの推計に使う値は以下の固定値（変えるときはここを直す）
const FIXED={ r0:293000, r12:132000, r35:79000,   // 基本分単価（月額・地域区分反映前）
  laborRate:0.70, otherRate:0.15,                 // 推計用の人件費率・その他経費率
  r3:20,                                          // 3歳児の配置基準（20:1）
  targetLabor:0.70, staffCost:270000 };           // 目標人件費率／職員1人あたり月額

function update(){
  const r0=FIXED.r0, r12=FIXED.r12, r35=FIXED.r35;
  const lRate=FIXED.laborRate, oRate=FIXED.otherRate, r3=FIXED.r3;
  const targetLaborRate=FIXED.targetLabor, staffCost=FIXED.staffCost;

  let totInc=0,totLab=0,totOth=0,totCh=0;

  PARKS.forEach(p=>{
    if(!p.hasData||p.v3)return;   // v3カードは v3Show() で描画

    const u0 =r0*p.mult, u12=r12*p.mult, u35=r35*p.mult;
    const total=p.age0+p.age1+p.age2+p.age3+p.age4+p.age5;
    const age12=p.age1+p.age2, age35=p.age3+p.age4+p.age5;
    // 請求書の実績データがある園はそれを正として使用。ない園は単価×人数の推計。
    // 月次報告書の実績がある園（p.actual）は、その収入・人件費・支出・利益をそのまま使う
    const A=p.actual;
    const inc=A ? A.income : (p.hasInvoice && p.invoiceIncome) ? p.invoiceIncome : (p.age0*u0+age12*u12+age35*u35);
    const lab=A ? A.labor : inc*lRate, oth=A ? A.expense-A.labor : inc*oRate, sur=A ? A.profit : inc-lab-oth;

    totInc+=inc; totLab+=lab; totOth+=oth; totCh+=total;

    if(!A){
    document.getElementById(p.id+'-income').textContent=fmtM(inc);
    document.getElementById(p.id+'-labor').textContent=fmtM(lab);
    const surEl=document.getElementById(p.id+'-surplus');
    surEl.textContent=fmtM(sur);
    surEl.className='park-stat-val '+(sur>=0?'positive':'negative');
    }

    // 充足バー
    if(p.capacity){
      const rate=Math.round(total/p.capacity*100);
      document.getElementById(p.id+'-cap-label').textContent=total+'/'+p.capacity+'名';
      document.getElementById(p.id+'-cap-bar').style.width=Math.min(rate,100)+'%';
    } else {
      document.getElementById(p.id+'-cap-label').textContent=total+'名在籍';
      document.getElementById(p.id+'-cap-bar').style.width='60%';
    }

    // 年齢テーブル（実績請求書がある園は、請求書の加算内訳を年齢帯ごとに按分した実績単価・小計を表示）
    let rowVals;
    if(A){
      rowVals=[{u:null,amt:null},{u:null,amt:null},{u:null,amt:null}];
    } else if(p.hasInvoice && p.invoiceRows){
      const ir=p.invoiceRows;
      rowVals=[
        {u:p.age0>0?Math.round(ir.amt0/p.age0):0, amt:ir.amt0},
        {u:age12>0?Math.round(ir.amt12/age12):0, amt:ir.amt12},
        {u:age35>0?Math.round(ir.amt35/age35):0, amt:ir.amt35},
      ];
    } else {
      rowVals=[
        {u:u0, amt:u0*p.age0},
        {u:u12, amt:u12*age12},
        {u:u35, amt:u35*age35},
      ];
    }
    [{rowId:p.id+'-r0', v:rowVals[0]},
     {rowId:p.id+'-r12',v:rowVals[1]},
     {rowId:p.id+'-r35',v:rowVals[2]}].forEach(r=>{
      const row=document.getElementById(r.rowId);
      if(row){ row.cells[2].textContent=r.v.u==null?'—':fmtN(r.v.u); row.cells[3].textContent=r.v.amt==null?'—':fmtM(r.v.amt); }
    });
    document.getElementById(p.id+'-total-n').textContent=total+'名';
    document.getElementById(p.id+'-total-val').textContent=fmtM(inc);

    // 職員
    const maxStaff=Math.floor(inc*targetLaborRate/staffCost);
    const req=calcReq(p,r3);
    document.getElementById(p.id+'-staff-req').textContent=req;
    document.getElementById(p.id+'-staff-max').textContent=maxStaff;

    const rangeEl=document.getElementById(p.id+'-staff-range');
    let barClass,rangeText;
    if(p.staffTotal<req){
      barClass='bar-actual-danger'; rangeText='⚠ 基準割れ';
      rangeEl.style.color='var(--accent2)';
    } else if(p.staffTotal<=maxStaff){
      barClass='bar-actual-ok'; rangeText='✓ 適正範囲';
      rangeEl.style.color='var(--green)';
    } else {
      barClass='bar-actual-warn'; rangeText='△ 上限超え';
      rangeEl.style.color='var(--accent2)';
    }
    rangeEl.textContent=rangeText;

    const maxVal=Math.max(p.staffTotal,maxStaff)*1.05;
    document.getElementById(p.id+'-bar-req').style.width=Math.min(req/maxVal*100,100)+'%';
    document.getElementById(p.id+'-bar-req-val').textContent=req+'名';
    const actualBar=document.getElementById(p.id+'-bar-actual');
    actualBar.style.width=Math.min(p.staffTotal/maxVal*100,100)+'%';
    actualBar.className='staff-bar-fill '+barClass;
  });

}

// ===== 本部限定表示（請求書リンク）=====
// 本部ダッシュボード（honbu2026でログイン済みの3名のみ入室可）からのリンクに
// 付与された ?src=honbu2026 を検知した場合のみ、原本ボタンを表示する。
const HONBU_SRC_KEY='src';
const HONBU_SRC_VAL='honbu2026';
(function initHonbuAccess(){
  try{
    const params=new URLSearchParams(location.search);
    if(params.get(HONBU_SRC_KEY)===HONBU_SRC_VAL){
      sessionStorage.setItem('keiei_honbu_ok','1');
      // アドレスバーにトークンを残さない
      const url=new URL(location.href);
      url.searchParams.delete(HONBU_SRC_KEY);
      history.replaceState(null,'',url.toString());
    }
  }catch(e){}
})();
function isHonbuUnlocked(){
  try{ return sessionStorage.getItem('keiei_honbu_ok')==='1'; }catch(e){ return false; }
}

// ===== 初期化 =====
window.addEventListener('resize',resizeViewport);
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',()=>{buildCards();update();goTo(0,false);});
}else{
  buildCards();update();goTo(0,false);
}
</script>
