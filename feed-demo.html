<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しおどめ掲示板（3カラム版デモ）</title>
<style>
  :root{
    --bg1:#efeafc; --bg2:#e7f0fb;
    --card:#ffffff; --line:#ebe9f6; --ink:#242042; --sub:#8a89a6;
    --grad:linear-gradient(135deg,#7c5cf0 0%,#4f8ef0 100%);
    --grad-soft:linear-gradient(135deg,#f4f0fe 0%,#eaf2fd 100%);
    --shiba:#2b6cb0; --shiba-bg:#eaf2fb;
    --yuga:#2f855a;  --yuga-bg:#e9f6ee;
    --hq:#4a4a7a;    --hq-bg:#eeecfa;
    --like:#e0517a;
    --hojyokin:#6A1B9A; --hojyokin-bg:#F3E5F5;
    --koteikakaku:#2E7D32; --koteikakaku-bg:#E8F5E9;
    --kasan:#E65100; --kasan-bg:#FFF3E0;
    --muni:#0D47A1;    --muni-bg:#E3F2FD;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,#eaf1fb 100%);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px; margin:0 auto; display:flex; gap:20px; padding:18px 16px 60px; align-items:flex-start;}

  /* ===== 左カラム ===== */
  .col-left{width:210px; flex:none; position:sticky; top:18px;}
  @media (max-width:820px){ .col-left{display:none} }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 10px 16px; text-decoration:none; color:inherit;}
  .brand .logo{width:34px; height:34px; border-radius:10px; background:var(--grad); display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px;}
  .brand b{font-size:16px;}
  .brand small{display:block; font-size:11px; color:var(--sub); font-weight:400;}
  .nav-item{
    display:flex; align-items:center; gap:13px; padding:11px 14px; border-radius:14px;
    color:var(--ink); text-decoration:none; font-size:15px; cursor:pointer; margin-bottom:2px;
  }
  .nav-item svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7;}
  .nav-item:hover{background:#fff;}
  .nav-item.active{background:#fff; font-weight:700; box-shadow:0 4px 14px rgba(90,70,190,.06);}
  .nav-post{
    display:block; width:100%; margin-top:12px; text-align:center; font-weight:700; font-size:15px;
    color:#fff; background:var(--grad); border:none; padding:13px; border-radius:999px; cursor:pointer;
    box-shadow:0 8px 20px rgba(96,86,220,.28);
  }
  .nav-post:hover{filter:brightness(1.06);}

  /* ===== 中央カラム ===== */
  .col-center{flex:1; min-width:0; max-width:600px;}
  .c-head{
    position:sticky; top:0; z-index:5; background:rgba(243,240,252,.86); backdrop-filter:blur(6px);
    padding:10px 6px 12px; margin:-4px 0 12px; border-radius:0 0 14px 14px;
  }
  .c-head h1{margin:0; font-size:18px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .c-head span{font-size:12px; color:var(--sub);}

  .me{display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin-bottom:12px;}
  .me label{font-size:12px; color:var(--sub);}
  .me select,.me input{font:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--line); border-radius:12px; background:#fbfbfe; color:var(--ink); outline:none;}
  .me input{flex:1; min-width:110px;}

  .composer{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:15px; margin-bottom:16px; box-shadow:0 8px 26px rgba(90,70,190,.07);}
  .composer textarea{width:100%; border:none; resize:vertical; min-height:52px; font:inherit; font-size:15px; color:var(--ink); outline:none; background:transparent;}
  .composer textarea::placeholder{color:#b0aec6;}
  .comp-foot{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .icon-btn{font:inherit; font-size:18px; line-height:1; background:#f7f5fe; border:1px solid var(--line); width:40px; height:40px; border-radius:12px; cursor:pointer;}
  .icon-btn:hover{background:#f0edfd;}
  .topics{display:flex; gap:6px; flex-wrap:wrap;}
  .topic{font-size:12px; padding:5px 12px; border-radius:999px; cursor:pointer; border:1px solid var(--line); background:#fbfbfe; color:var(--sub); user-select:none;}
  .topic[aria-pressed="true"]{background:var(--grad); color:#fff; border-color:transparent;}
  .post-btn{margin-left:auto; font:inherit; font-weight:700; font-size:14px; color:#fff; background:var(--grad); border:none; padding:11px 22px; border-radius:999px; cursor:pointer; box-shadow:0 6px 16px rgba(96,86,220,.28);}
  .post-btn:disabled{opacity:.4; box-shadow:none; cursor:default;}
  .post-btn:not(:disabled):hover{filter:brightness(1.06);}
  .preview{position:relative; margin-top:12px; display:none;}
  .preview.show{display:block;}
  .preview img{max-width:100%; border-radius:16px; display:block;}
  .preview .rm{position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; background:rgba(20,10,40,.6); color:#fff; border:none; cursor:pointer; font-size:16px;}

  .feed{display:flex; flex-direction:column; gap:14px;}
  .post{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:16px 17px; box-shadow:0 6px 20px rgba(90,70,190,.05); animation:rise .3s ease both;}
  .post.mine{background:var(--grad-soft); border-color:transparent; box-shadow:0 8px 22px rgba(96,86,220,.12);}
  @keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){.post{animation:none}}
  .p-head{display:flex; align-items:center; gap:11px;}
  .avatar{width:40px; height:40px; border-radius:50%; flex:none; color:#fff; font-weight:700; font-size:15px; display:grid; place-items:center; box-shadow:0 0 0 3px rgba(255,255,255,.7);}
  .p-name{font-weight:700; font-size:14px; line-height:1.2;}
  .p-meta{display:flex; align-items:center; gap:6px; margin-top:3px;}
  .badge{font-size:11px; padding:2px 9px; border-radius:999px; font-weight:700;}
  .b-shiba{color:var(--shiba); background:var(--shiba-bg);}
  .b-yuga{color:var(--yuga); background:var(--yuga-bg);}
  .b-hq{color:var(--hq); background:var(--hq-bg);}
  .time{font-size:11px; color:var(--sub);}
  .chip{margin-left:auto; font-size:11px; color:#6a5cd0; background:#efeafd; padding:3px 11px; border-radius:999px; font-weight:600;}
  .p-body{font-size:15px; line-height:1.7; margin:12px 2px 0; white-space:pre-wrap; word-break:break-word;}
  .p-photo{margin-top:12px;}
  .p-photo img{max-width:100%; border-radius:18px; display:block;}
  .p-acts{display:flex; gap:6px; margin-top:13px; padding-top:11px; border-top:1px solid rgba(120,110,180,.12);}
  .act{display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:13px; color:var(--sub); background:none; border:none; cursor:pointer; padding:6px 12px; border-radius:999px;}
  .act:hover{background:rgba(120,100,220,.08);}
  .act.liked{color:var(--like); font-weight:700; background:rgba(224,81,122,.09);}
  .comments{margin-top:12px; display:none; flex-direction:column; gap:10px;}
  .comments.open{display:flex;}
  .cmt{display:flex; gap:9px;}
  .cmt .avatar{width:30px; height:30px; font-size:12px; box-shadow:0 0 0 2px rgba(255,255,255,.7);}
  .cmt-bubble{background:#f4f2fc; border-radius:16px; border-top-left-radius:5px; padding:9px 12px; flex:1;}
  .post.mine .cmt-bubble{background:#fff;}
  .cmt-name{font-size:12px; font-weight:700;}
  .cmt-name .badge{margin-left:6px; font-size:10px;}
  .cmt-text{font-size:13px; line-height:1.55; margin-top:2px;}
  .cmt-form{display:flex; gap:8px; align-items:center; margin-top:2px;}
  .cmt-form input{flex:1; font:inherit; font-size:13px; padding:9px 14px; border:1px solid var(--line); border-radius:999px; background:#fbfbfe; outline:none;}
  .cmt-form button{font:inherit; font-size:13px; color:#fff; background:var(--grad); border:none; cursor:pointer; font-weight:700; padding:8px 15px; border-radius:999px;}
  .cmt-form button:disabled{background:#d4d2e6; cursor:default;}
  .empty-feed{text-align:center; color:var(--sub); font-size:13px; padding:30px;}

  /* ===== 右カラム ===== */
  .col-right{width:300px; flex:none; position:sticky; top:18px; display:flex; flex-direction:column; gap:14px;}
  @media (max-width:1000px){ .col-right{display:none} }
  .widget{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 15px; box-shadow:0 6px 20px rgba(90,70,190,.05);}
  .w-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .w-head b{font-size:14px;}
  .w-head .sub{font-size:11px; color:var(--sub);}
  .w-all{font-size:11px; color:#6a5cd0; text-decoration:none;}

  /* 予定・締め切り（補助金） */
  #deadline-list{max-height:288px; overflow-y:auto;}
  .dl-row{display:flex; gap:9px; padding:9px 0; border-top:1px dashed rgba(120,110,180,.18);}
  .dl-row:first-child{border-top:none;}
  .dl-date{font-size:10px; color:#000; white-space:nowrap; padding-top:2px; width:56px; flex:none;}
  .dl-body{flex:1; min-width:0;}
  .tag{font-size:10px; padding:1px 7px; border-radius:6px; font-weight:700; margin-right:4px; display:inline-block; vertical-align:1px;}
  .t-hojyokin{color:var(--hojyokin); background:var(--hojyokin-bg);}
  .t-koteikakaku{color:var(--koteikakaku); background:var(--koteikakaku-bg);}
  .t-kasan{color:var(--kasan); background:var(--kasan-bg);}
  .t-deadline-soon{color:#C62828; background:#FDECEA;}
  .t-deadline-past{color:#90A4AE; background:#ECEFF1;}
  .t-deadline-urgent{color:#C62828; background:#FFEBEE; border:1px solid #E53935; animation:deadlineBlink .9s infinite;}
  @keyframes deadlineBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
  .t-muni{color:var(--muni); background:var(--muni-bg);}
  .dl-title{font-size:12px; line-height:1.45; color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .load-s,.empty-s{font-size:12px; color:var(--sub); padding:8px 2px;}

  /* 今週の注目 */
  .hot-row{display:flex; gap:9px; padding:9px 0; border-top:1px dashed rgba(120,110,180,.18); cursor:pointer;}
  .hot-row:first-child{border-top:none;}
  .hot-rank{font-weight:800; font-size:14px; color:#b7b3d6; width:16px; flex:none;}
  .hot-text{font-size:12px; line-height:1.45; flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .hot-like{font-size:11px; color:var(--like); white-space:nowrap; flex:none;}
  .hot-row:hover .hot-text{color:#6a5cd0;}

  /* トピック */
  .topic-chips{display:flex; flex-wrap:wrap; gap:7px;}
  .rt{font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer; border:1px solid var(--line); background:#fbfbfe; color:var(--sub);}
  .rt.on{background:var(--grad); color:#fff; border-color:transparent;}

  .foot-note{font-size:11px; color:var(--sub); text-align:center; margin-top:6px; line-height:1.6;}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 左：ナビ ===== -->
  <aside class="col-left">
    <a class="brand" href="https://kimkat01.github.io/shiodome-knowledge/#main" target="_blank" rel="noopener" title="ナレッジボードへ戻る">
      <span class="logo">し</span><span><b>しおどめ</b><small>ナレッジボードへ戻る</small></span>
    </a>
    <a class="nav-item active" data-filter="all">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>ホーム</a>
    <a class="nav-item" data-filter="お知らせ">
      <svg viewBox="0 0 24 24"><path d="M4 11l14-6v14L4 13z"/><path d="M8 12v5"/></svg>お知らせ</a>
    <a class="nav-item" data-filter="mine">
      <svg viewBox="0 0 24 24"><path d="M3 20V9l9-5 9 5v11"/><path d="M9 20v-6h6v6"/></svg>自分の園</a>
    <a class="nav-item" data-filter="save">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>保存した投稿</a>
    <a class="nav-item" data-filter="notice">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10 20a2 2 0 004 0"/></svg>通知</a>
    <a class="nav-item" data-filter="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6"/></svg>プロフィール</a>
    <button class="nav-post" id="navPost">＋ 投稿する</button>
  </aside>

  <!-- ===== 中央：フィード ===== -->
  <main class="col-center">
    <div class="c-head"><h1>しおどめ掲示板</h1><span id="feedLabel">すべての投稿</span></div>

    <div class="me">
      <label for="who">投稿者</label>
      <select id="who"></select>
      <input id="myname" type="text" placeholder="お名前" value="山田">
    </div>

    <div class="composer" id="composer">
      <textarea id="body" placeholder="いまの共有を書く…（例：良かった保育の工夫、ヒヤリの気づき、質問など）"></textarea>
      <div class="preview" id="preview"><button class="rm" id="rmImg" title="削除">×</button><img id="pvImg" alt="添付プレビュー"></div>
      <div class="comp-foot">
        <input type="file" id="file" accept="image/*" hidden>
        <button class="icon-btn" id="attach" title="写真を追加">📷</button>
        <div class="topics" id="topics">
          <span class="topic" data-t="お知らせ" role="button" aria-pressed="false">お知らせ</span>
          <span class="topic" data-t="質問" role="button" aria-pressed="false">質問</span>
          <span class="topic" data-t="ノウハウ" role="button" aria-pressed="false">ノウハウ</span>
          <span class="topic" data-t="できごと" role="button" aria-pressed="false">できごと</span>
        </div>
        <button class="post-btn" id="postBtn" disabled>投稿</button>
      </div>
    </div>

    <div class="feed" id="feed"></div>
  </main>

  <!-- ===== 右：予定・締め切り／注目／トピック ===== -->
  <aside class="col-right">
    <div class="widget">
      <div class="w-head">
        <b>💰 補助金情報</b>
        <a class="w-all" href="https://kimkat01.github.io/shiodome-knowledge/#main" target="_blank" rel="noopener">ボードで全部見る</a>
      </div>
      <div class="w-head" style="margin:-6px 0 6px;"><span class="sub">ナレッジボードから自動表示</span></div>
      <div id="deadline-list"><div class="load-s">補助金情報を読み込み中…</div></div>
    </div>

    <div class="widget">
      <div class="w-head"><b>🔥 今週の注目</b></div>
      <div id="hot-list"></div>
    </div>

    <div class="widget">
      <div class="w-head"><b>🏷 トピック</b></div>
      <div class="topic-chips" id="right-topics">
        <span class="rt" data-t="お知らせ">#お知らせ</span>
        <span class="rt" data-t="質問">#質問</span>
        <span class="rt" data-t="ノウハウ">#ノウハウ</span>
        <span class="rt" data-t="できごと">#できごと</span>
      </div>
    </div>

    <p class="foot-note">※ 見た目のデモです。投稿はこの画面内のみの一時保存で、補助金情報だけはボードと同じ実データを表示しています。</p>
  </aside>

</div>

    ] },

    body:"アレルギー対応の献立表、最新のひな形ってどこにありましたっけ？探しても見つからず…",

function ago(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "たった今";
  const m=Math.floor(s/60); if(m<60) return `${m}分前`;
  const h=Math.floor(m/60); if(h<24) return `${h}時間前`;
  return `${Math.floor(h/24)}日前`;
}
function initial(name){ return (name||"?").trim().charAt(0) || "?"; }

/* フィルタ */
let filter = {type:"all", value:null};
const LABELS = {all:"すべての投稿", お知らせ:"#お知らせ", 質問:"#質問", ノウハウ:"#ノウハウ", できごと:"#できごと",
  mine:"自分の園の投稿", save:"保存した投稿", notice:"通知", me:"プロフィール"};
function setFilter(type){
  filter = {type};
  document.getElementById("feedLabel").textContent = LABELS[type]||"";
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.filter===type));
  document.querySelectorAll(".rt").forEach(c=>c.classList.toggle("on", c.dataset.t===type));
  render();
}
function passFilter(p){
  const t=filter.type;
  if(t==="all"||t==="notice"||t==="save") return true; // 通知/保存はデモでは全件表示
  if(t==="mine"||t==="me") return p.code===who.value;
  return p.topic===t; // トピック系
}

const feed = document.getElementById("feed");
function render(){
  const meName = myname.value.trim()||"名無し";
  const list = posts.slice().sort((a,b)=>b.ts-a.ts).filter(passFilter);
  feed.innerHTML = list.length ? "" : '<div class="empty-feed">該当する投稿はまだありません。</div>';
  list.forEach(p=>{
    const mine = p.code===who.value && p.name===meName;
    const el=document.createElement("div"); el.className="post"+(mine?" mine":""); el.dataset.pid=p.id;
    el.innerHTML=`
      <div class="p-head">
        <div class="avatar" style="background:${orgColor(p.org)}">${initial(p.name)}</div>
        <div><div class="p-name">${esc(p.name)}</div>
          <div class="p-meta"><span class="badge ${orgClass(p.org)}">${p.code}</span><span class="time">${ago(p.ts)}</span></div></div>
        ${p.topic?`<span class="chip">#${esc(p.topic)}</span>`:""}
      </div>
      ${p.body?`<div class="p-body">${esc(p.body)}</div>`:""}
      ${p.img?`<div class="p-photo"><img src="${p.img}" alt="添付写真"></div>`:""}
      <div class="p-acts">
        <button class="act ${p.liked?'liked':''}" data-like="${p.id}">${p.liked?'♥':'♡'} <span>いいね${p.likes?` ${p.likes}`:''}</span></button>
        <button class="act" data-toggle="${p.id}">💬 <span>コメント${p.comments.length?` ${p.comments.length}`:''}</span></button>
      </div>
      <div class="comments" id="c-${p.id}">
        ${p.comments.map(c=>`
          <div class="cmt"><div class="avatar" style="background:${orgColor(c.org)}">${initial(c.name)}</div>
            <div class="cmt-bubble"><div class="cmt-name">${esc(c.name)}<span class="badge ${orgClass(c.org)}">${c.code}</span></div>
              <div class="cmt-text">${esc(c.text)}</div></div></div>`).join("")}
        <div class="cmt-form"><input type="text" placeholder="コメントを書く…" data-cin="${p.id}"><button data-csend="${p.id}" disabled>送信</button></div>
      </div>`;
    feed.appendChild(el);
  });
  renderHot();
}

/* 今週の注目（いいね上位3件） */
function renderHot(){
  const box=document.getElementById("hot-list");
  const top=posts.slice().sort((a,b)=>b.likes-a.likes).slice(0,3);
  box.innerHTML = top.map((p,i)=>`
    <div class="hot-row" data-goto="${p.id}">
      <span class="hot-rank">${i+1}</span>
      <span class="hot-text">${esc(p.body||"（写真の投稿）")}</span>
      <span class="hot-like">♥ ${p.likes}</span>
    </div>`).join("");
}

/* 投稿 */
const bodyEl=document.getElementById("body"), postBtn=document.getElementById("postBtn");
let topic=null, attached=null;
document.getElementById("topics").addEventListener("click",e=>{
  const t=e.target.closest(".topic"); if(!t) return;
  const on=t.getAttribute("aria-pressed")==="true";
  document.querySelectorAll(".topic").forEach(x=>x.setAttribute("aria-pressed","false"));
  if(!on){ t.setAttribute("aria-pressed","true"); topic=t.dataset.t; } else { topic=null; }
});
function refreshPostBtn(){ postBtn.disabled = bodyEl.value.trim()==="" && !attached; }
bodyEl.addEventListener("input", refreshPostBtn);

const fileInput=document.getElementById("file");
document.getElementById("attach").addEventListener("click",()=>fileInput.click());
fileInput.addEventListener("change",()=>{
  const f=fileInput.files[0]; if(!f) return;
  resizeImage(f,1000,0.8).then(u=>{ attached=u; document.getElementById("pvImg").src=u; document.getElementById("preview").classList.add("show"); refreshPostBtn(); });
  fileInput.value="";
});
document.getElementById("rmImg").addEventListener("click",()=>{ attached=null; document.getElementById("preview").classList.remove("show"); refreshPostBtn(); });
function resizeImage(file,maxW,q){
  return new Promise(res=>{ const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,maxW/img.width), w=Math.round(img.width*s), h=Math.round(img.height*s);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",q)); }; img.src=url; });
}
postBtn.addEventListener("click",()=>{
  const o=findOrg(who.value), name=myname.value.trim()||"名無し";
  posts.push({ id:++uid, code:o.code, name, org:o.org, topic, ts:Date.now(), body:bodyEl.value.trim(), img:attached, likes:0, liked:false, comments:[] });
  bodyEl.value=""; topic=null; attached=null;
  document.getElementById("preview").classList.remove("show");
  document.querySelectorAll(".topic").forEach(x=>x.setAttribute("aria-pressed","false"));
  if(filter.type!=="all" && filter.type!=="notice" && filter.type!=="save") setFilter("all");
  refreshPostBtn(); render();
});
who.addEventListener("change", render);
myname.addEventListener("input", render);

/* いいね・コメント */
feed.addEventListener("click",e=>{
  const like=e.target.closest("[data-like]");
  if(like){ const p=posts.find(x=>x.id==like.dataset.like); p.liked=!p.liked; p.likes+=p.liked?1:-1; render(); return; }
  const tog=e.target.closest("[data-toggle]");
  if(tog){ document.getElementById("c-"+tog.dataset.toggle).classList.toggle("open"); return; }
  const send=e.target.closest("[data-csend]");
  if(send){ const id=send.dataset.csend, input=feed.querySelector(`[data-cin="${id}"]`), txt=input.value.trim(); if(!txt) return;
    const o=findOrg(who.value), name=myname.value.trim()||"名無し";
    posts.find(x=>x.id==id).comments.push({code:o.code, name, org:o.org, text:txt});
    render(); const box=document.getElementById("c-"+id); if(box) box.classList.add("open");
  }
});
feed.addEventListener("input",e=>{ const cin=e.target.closest("[data-cin]"); if(cin){ feed.querySelector(`[data-csend="${cin.dataset.cin}"]`).disabled = cin.value.trim()===""; } });
feed.addEventListener("keydown",e=>{ const cin=e.target.closest("[data-cin]"); if(cin && e.key==="Enter"){ feed.querySelector(`[data-csend="${cin.dataset.cin}"]`).click(); } });

/* ナビ・トピック・注目 */
document.querySelectorAll(".nav-item").forEach(n=>n.addEventListener("click",()=>setFilter(n.dataset.filter)));
document.querySelectorAll(".rt").forEach(c=>c.addEventListener("click",()=>{
  setFilter(filter.type===c.dataset.t ? "all" : c.dataset.t);
}));
document.getElementById("navPost").addEventListener("click",()=>{ window.scrollTo({top:0,behavior:"smooth"}); bodyEl.focus(); });
document.getElementById("hot-list").addEventListener("click",e=>{
  const r=e.target.closest("[data-goto]"); if(!r) return;
  if(filter.type!=="all") setFilter("all");
  const el=feed.querySelector(`[data-pid="${r.dataset.goto}"]`);
  if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.style.transition="box-shadow .4s"; el.style.boxShadow="0 0 0 3px rgba(124,92,240,.4)"; setTimeout(()=>el.style.boxShadow="",1200); }
});

/* 予定・締め切り（補助金 = ボードと同じ実データ、4件） */
function loadHojyokin(){
  const box=document.getElementById("deadline-list");
  fetch("https://raw.githubusercontent.com/kimkat01/shiodome-knowledge/main/hojyokin.json?t="+Date.now())
    .then(r=>r.json())
    .then(list=>{
      if(!Array.isArray(list)||!list.length){ box.innerHTML='<div class="empty-s">📭 現在お知らせはありません</div>'; return; }
      box.innerHTML = list.map(it=>{
        const t=it.title||"";
        // 種類判定（優先順：公定価格 ＞ 加算 ＞ 補助金）
        let kLabel="補助金", kCls="t-hojyokin";
        if(t.indexOf("公定価格")!==-1){ kLabel="公定価格"; kCls="t-koteikakaku"; }
        else if(t.indexOf("加算")!==-1||t.indexOf("処遇改善")!==-1||t.indexOf("キャリアアップ")!==-1){ kLabel="加算"; kCls="t-kasan"; }
        // 締切判定（件名から「◯/◯〆」「◯/◯期限」等を抽出）
        let dTag="";
        const z=t.normalize?t.normalize("NFKC"):t;
        const dm=z.match(/(\d{1,2})\s*[\/／]\s*(\d{1,2})\s*(?:〆|締切|締め切り|期限|まで)/);
        if(dm){
          const mo=parseInt(dm[1],10),da=parseInt(dm[2],10);
          if(mo>=1&&mo<=12&&da>=1&&da<=31){
            let yr=new Date().getFullYear(),em=null;
            const im=(it.date||"").match(/(\d{4})[\/\-](\d{1,2})/);
            if(im){ yr=parseInt(im[1],10); em=parseInt(im[2],10); }
            if(em!==null&&em>=10&&mo<=3)yr+=1;
            const dl=new Date(yr,mo-1,da), td=new Date(); td.setHours(0,0,0,0);
            const diff=Math.round((dl-td)/86400000);
            let label="〆"+mo+"/"+da, cls;
            if(diff<0){ cls="t-deadline-past"; label="〆"+mo+"/"+da+"（終了）"; }
            else if(diff===0){ cls="t-deadline-urgent"; label="〆"+mo+"/"+da+" 本日"; }
            else if(diff<=3){ cls="t-deadline-urgent"; label="〆"+mo+"/"+da+" あと"+diff+"日"; }
            else{ cls="t-deadline-soon"; }
            dTag=`<span class="tag ${cls}">${label}</span>`;
          }
        }
        return `
        <div class="dl-row">
          <div class="dl-date">${esc(it.date||"")}</div>
          <div class="dl-body">
            <span class="tag ${kCls}">${kLabel}</span>${dTag}${it.muni?`<span class="tag t-muni">${esc(it.muni)}</span>`:""}
            <div class="dl-title">${esc(it.title||"")}</div>
          </div>
        </div>`;
      }).join("");
    })
    .catch(()=>{ box.innerHTML='<div class="empty-s">読み込みに失敗しました（ボードで確認してください）</div>'; });
}

render();
loadHojyokin();
</script>
