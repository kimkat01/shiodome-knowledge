<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>規約・マニュアル｜しおどめ保育園三郷中央</title>
<style>
  :root{
    --bg1:#efeafc; --bg2:#e7f0fb;
    --card:#ffffff; --line:#ebe9f6; --ink:#242042; --sub:#8a89a6;
    --grad:linear-gradient(135deg,#7c5cf0 0%,#4f8ef0 100%);
    --grad-soft:linear-gradient(135deg,#f4f0fe 0%,#eaf2fd 100%);
    --hit:#ffe17a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,#eaf1fb 100%);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }

  /* ===== ヘッダー ===== */
  header{display:flex; align-items:center; gap:12px; padding:12px 24px; max-width:1400px; width:100%; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{width:34px; height:34px; border-radius:10px; background:var(--grad); display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px;}
  .brand b{font-size:14px; line-height:1.25; display:block;}
  .brand small{display:block; font-size:11px; color:var(--sub); font-weight:400;}
  .back{margin-left:auto; font-size:13px; font-weight:700; color:#5a54c8; text-decoration:none; display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px; background:#fff; box-shadow:0 2px 8px rgba(60,50,150,.08);}
  .back:hover{filter:brightness(.98);}

  /* ===== レイアウト ===== */
  .wrap{flex:1; display:flex; gap:20px; max-width:1400px; width:100%; margin:0 auto; padding:4px 24px 28px; min-height:0;}

  /* 左：文書一覧（ジャンル分け） */
  .side{width:270px; flex:none;}
  .side-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 12px; box-shadow:0 2px 10px rgba(30,32,60,.06); position:sticky; top:12px;}
  .side-title{font-size:12px; font-weight:800; color:var(--sub); letter-spacing:.04em; padding:2px 8px 10px;}
  .grp{margin-bottom:12px;}
  .grp:last-child{margin-bottom:2px;}
  .grp-label{font-size:11px; font-weight:800; color:#7a5cf0; letter-spacing:.04em; padding:4px 10px; display:flex; align-items:center; gap:6px;}
  .grp-label::before{content:""; width:8px; height:8px; border-radius:3px; background:var(--grad);}
  .doc{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:12px; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; transition:background .12s; margin:1px 0;}
  .doc svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.7; flex:none; opacity:.7;}
  .doc:hover{background:var(--grad-soft);}
  .doc.active{background:var(--grad); color:#fff;}
  .doc.active svg{opacity:1;}

  /* 右：ビューア */
  .viewer{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 2px 10px rgba(30,32,60,.06); overflow:hidden;}
  .vtop{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .vtitle{font-size:15px; font-weight:800; margin-right:auto; min-width:120px;}
  .search{display:flex; align-items:center; gap:6px; background:#f5f4fb; border:1px solid var(--line); border-radius:999px; padding:5px 6px 5px 12px;}
  .search svg{width:16px; height:16px; stroke:var(--sub); fill:none; stroke-width:2; flex:none;}
  .search input{border:none; background:transparent; outline:none; font-size:13.5px; width:180px; color:var(--ink); font-family:inherit;}
  .search input::placeholder{color:#b4b2c8;}
  .nav-btn{border:none; background:#fff; border:1px solid var(--line); width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:13px; color:#5a54c8; display:grid; place-items:center;}
  .nav-btn:hover{background:var(--grad-soft);}
  .nav-btn:disabled{opacity:.4; cursor:default;}
  .hit-count{font-size:12px; font-weight:700; color:var(--sub); min-width:70px; text-align:right;}

  .pages{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; align-items:center; gap:16px; background:#f3f2f8;}
  .pdfpage{position:relative; background:#fff; box-shadow:0 3px 14px rgba(30,32,60,.12); border-radius:4px; overflow:hidden; scroll-margin-top:14px;}
  .pdfpage canvas{display:block;}
  .pdfpage .pno{position:absolute; top:6px; right:8px; font-size:10px; font-weight:700; color:#9a99b5; background:rgba(255,255,255,.82); padding:1px 7px; border-radius:999px;}
  .pdfpage.flash{outline:3px solid #7c5cf0; outline-offset:-3px; animation:flash 1.4s ease;}
  @keyframes flash{0%{outline-color:#7c5cf0;}70%{outline-color:#7c5cf0;}100%{outline-color:transparent;}}

  .state{padding:40px 20px; text-align:center; color:var(--sub); font-size:14px; line-height:1.7;}
  .state .big{font-size:15px; font-weight:700; color:var(--ink);}
  .spin{width:26px; height:26px; border:3px solid #dcd9ef; border-top-color:#7c5cf0; border-radius:50%; animation:sp .8s linear infinite; margin:0 auto 12px;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* ===== レスポンシブ ===== */
  @media (max-width:820px){
    .wrap{flex-direction:column; padding:4px 12px 20px;}
    .side{width:100%;}
    .side-card{position:static;}
    .grp{display:inline-block; margin-right:6px;}
    .search input{width:120px;}
    .pages{padding:10px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">し</span>
    <span><b>しおどめ保育園三郷中央</b><small>規約・マニュアル</small></span>
  </div>
  <a class="back" href="https://kimkat01.github.io/shiodome-knowledge/">← ナレッジボードへ戻る</a>
</header>

<div class="wrap">
  <!-- 左：文書一覧 -->
  <aside class="side">
    <div class="side-card">
      <div class="side-title">文書一覧</div>
      <div id="docList"></div>
    </div>
  </aside>

  <!-- 右：ビューア -->
  <main class="viewer">
    <div class="vtop">
      <div class="vtitle" id="vtitle">読み込み中…</div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="この文書内を検索" autocomplete="off">
        <button class="nav-btn" id="prev" title="前の一致" disabled>‹</button>
        <button class="nav-btn" id="next" title="次の一致" disabled>›</button>
      </div>
      <div class="hit-count" id="hits"></div>
    </div>
    <div class="pages" id="pages">
      <div class="state"><div class="spin"></div>読み込み中…</div>
    </div>
  </main>
</div>

<!-- PDF.js（描画・全文検索用） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ===========================================================
   文書一覧（ジャンル分け）
   ・追加は該当グループの docs に1行足すだけ
   ・title=表示名／file=PDFファイル名（半角英数字・小文字推奨）
   =========================================================== */
var GROUPS = [
  { label:"規約・マニュアル", docs:[
    { title:"就業規則", file:"shugyo-kisoku.pdf" },
    { title:"給与規定", file:"kyuyo-kitei.pdf" },
    { title:"運営規定", file:"unei-kitei.pdf" }
  ]},
  { label:"BCP・防災", docs:[
    { title:"業務継続計画（BCP）", file:"misato-bcp.pdf" }
  ]},
  { label:"参考資料", docs:[
    { title:"こども性暴力防止法の施行について", file:"kodomo-seibouryoku-hou.pdf" }
  ]}
];

/* ---- PDF.js worker ---- */
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* ---- 要素 ---- */
var elList = document.getElementById("docList");
var elPages = document.getElementById("pages");
var elTitle = document.getElementById("vtitle");
var elQ = document.getElementById("q");
var elHits = document.getElementById("hits");
var btnPrev = document.getElementById("prev");
var btnNext = document.getElementById("next");

var pageInfo = [];      // {pageDiv, text}
var matches = [];       // 一致ページ [{idx,count}]
var matchPtr = -1;
var loadToken = 0;      // 読み込み世代（切替時の競合防止）

/* ---- 左メニュー生成 ---- */
var docIcon = '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>';
GROUPS.forEach(function(g){
  var grp = document.createElement("div");
  grp.className = "grp";
  var lab = document.createElement("div");
  lab.className = "grp-label";
  lab.textContent = g.label;
  grp.appendChild(lab);
  g.docs.forEach(function(d){
    var item = document.createElement("div");
    item.className = "doc";
    item.innerHTML = docIcon + "<span>" + esc(d.title) + "</span>";
    item.addEventListener("click", function(){ openDoc(d, item); });
    grp.appendChild(item);
    d._el = item;
  });
  elList.appendChild(grp);
});

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

/* ---- 文書を開く ---- */
function openDoc(d, el){
  document.querySelectorAll(".doc.active").forEach(function(n){ n.classList.remove("active"); });
  if(el) el.classList.add("active");
  elTitle.textContent = d.title;
  elQ.value = "";
  resetSearchUI();
  loadPdf(d.file);
}

function loadPdf(file){
  var myToken = ++loadToken;
  pageInfo = [];
  elPages.innerHTML = '<div class="state"><div class="spin"></div>読み込み中…</div>';

  if(!window.pdfjsLib){
    elPages.innerHTML = '<div class="state"><div class="big">表示コンポーネントを読み込めませんでした</div>'
      + 'ネットワーク環境をご確認のうえ、ページを再読み込みしてください。</div>';
    return;
  }

  pdfjsLib.getDocument(file).promise.then(function(pdf){
    if(myToken !== loadToken) return;      // 別の文書に切り替わっていたら中断
    elPages.innerHTML = "";
    renderSequential(pdf, 1, myToken);
  }).catch(function(){
    if(myToken !== loadToken) return;
    elPages.innerHTML = '<div class="state"><div class="big">PDFを読み込めませんでした</div>'
      + 'ファイル「' + esc(file) + '」がリポジトリにあるかご確認ください。</div>';
  });
}

/* ページを順番に描画（テキストも抽出して検索用に保持） */
function renderSequential(pdf, num, token){
  if(token !== loadToken) return;
  if(num > pdf.numPages) return;

  pdf.getPage(num).then(function(page){
    if(token !== loadToken) return;
    var containerW = elPages.clientWidth - 36;
    var base = page.getViewport({scale:1});
    var scale = containerW > 0 ? Math.min(containerW / base.width, 2.0) : 1.2;
    if(!isFinite(scale) || scale <= 0) scale = 1.2;
    var viewport = page.getViewport({scale:scale});
    var dpr = window.devicePixelRatio || 1;

    var pageDiv = document.createElement("div");
    pageDiv.className = "pdfpage";
    pageDiv.style.width = viewport.width + "px";
    pageDiv.style.height = viewport.height + "px";

    var canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width = viewport.width + "px";
    canvas.style.height = viewport.height + "px";
    pageDiv.appendChild(canvas);

    var tag = document.createElement("div");
    tag.className = "pno";
    tag.textContent = "P" + num;
    pageDiv.appendChild(tag);

    elPages.appendChild(pageDiv);

    var renderTask = page.render({
      canvasContext: canvas.getContext("2d"),
      viewport: viewport,
      transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null
    });

    // テキスト抽出（検索用）
    page.getTextContent().then(function(tc){
      var txt = tc.items.map(function(it){ return it.str || ""; }).join("");
      pageInfo.push({ pageDiv: pageDiv, text: txt });
    });

    renderTask.promise.then(function(){
      renderSequential(pdf, num + 1, token);   // 次のページへ
    });
  });
}

/* ===== 検索（この文書内の全文をページ単位で検索） ===== */
var searchTimer = null;
elQ.addEventListener("input", function(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 220);
});
btnPrev.addEventListener("click", function(){ gotoMatch(matchPtr - 1); });
btnNext.addEventListener("click", function(){ gotoMatch(matchPtr + 1); });
elQ.addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); gotoMatch(matchPtr + 1); }
});

function resetSearchUI(){
  matches = []; matchPtr = -1;
  elHits.textContent = "";
  btnPrev.disabled = btnNext.disabled = true;
  clearFlash();
}

function doSearch(){
  var q = elQ.value.trim().toLowerCase();
  matches = []; matchPtr = -1;
  clearFlash();
  if(!q){ resetSearchUI(); return; }

  var total = 0;
  pageInfo.forEach(function(pi){
    var hay = pi.text.toLowerCase();
    var c = 0, from = 0, at;
    while((at = hay.indexOf(q, from)) !== -1){ c++; from = at + q.length; }
    if(c > 0){ matches.push({ pageDiv: pi.pageDiv, count: c }); total += c; }
  });

  // ページ順に並べ替え（描画完了順のズレを吸収）
  matches.sort(function(a,b){
    return elPages.querySelectorAll(".pdfpage").length
      ? (indexOfPage(a.pageDiv) - indexOfPage(b.pageDiv)) : 0;
  });

  if(total === 0){
    elHits.textContent = "該当なし";
    btnPrev.disabled = btnNext.disabled = true;
    return;
  }
  btnPrev.disabled = btnNext.disabled = false;
  gotoMatch(0);
}

function indexOfPage(pd){
  return Array.prototype.indexOf.call(elPages.querySelectorAll(".pdfpage"), pd);
}

function gotoMatch(i){
  if(!matches.length) return;
  matchPtr = ((i % matches.length) + matches.length) % matches.length;
  var m = matches[matchPtr];
  clearFlash();
  m.pageDiv.classList.add("flash");
  m.pageDiv.scrollIntoView({ behavior:"smooth", block:"start" });
  var totalHits = matches.reduce(function(s,x){ return s + x.count; }, 0);
  elHits.textContent = (matchPtr + 1) + "/" + matches.length + "ページ・計" + totalHits + "件";
}

function clearFlash(){
  var f = elPages.querySelector(".pdfpage.flash");
  if(f) f.classList.remove("flash");
}

/* ---- 初期表示：先頭の文書を開く ---- */
(function initFirst(){
  var first = GROUPS[0] && GROUPS[0].docs[0];
  if(first) openDoc(first, first._el);
})();

/* 画面幅が変わったら現在の文書を描き直す（可読性維持） */
var rsTimer = null;
window.addEventListener("resize", function(){
  clearTimeout(rsTimer);
  rsTimer = setTimeout(function(){
    var active = document.querySelector(".doc.active");
    if(!active) return;
    // アクティブな文書を特定して開き直す
    for(var gi=0; gi<GROUPS.length; gi++){
      for(var di=0; di<GROUPS[gi].docs.length; di++){
        if(GROUPS[gi].docs[di]._el === active){ openDoc(GROUPS[gi].docs[di], active); return; }
      }
    }
  }, 300);
});
</script>
</body>
</html>
