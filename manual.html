<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>規約・マニュアル｜しおどめ保育園三郷中央</title>
<style>
  :root{
    --bg1:#efeafc; --bg2:#e7f0fb;
    --card:#ffffff; --line:#ebe9f6; --ink:#242042; --sub:#8a89a6;
    --grad:linear-gradient(135deg,#7c5cf0 0%,#4f8ef0 100%);
    --grad-soft:linear-gradient(135deg,#f4f0fe 0%,#eaf2fd 100%);
  }
  *{box-sizing:border-box}
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,#eaf1fb 100%);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{display:flex; align-items:center; gap:12px; padding:12px 24px; max-width:1400px; width:100%; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{width:34px; height:34px; border-radius:10px; background:var(--grad); display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px;}
  .brand b{font-size:14px; line-height:1.25; display:block;}
  .brand small{display:block; font-size:11px; color:var(--sub); font-weight:400;}
  .back{margin-left:auto; font-size:13px; font-weight:700; color:#5a54c8; text-decoration:none; display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px; background:#fff; box-shadow:0 2px 8px rgba(60,50,150,.08);}
  .back:hover{filter:brightness(.98);}

  .wrap{flex:1; display:flex; gap:20px; max-width:1400px; width:100%; margin:0 auto; padding:4px 24px 28px; min-height:0;}

  .side{width:280px; flex:none;}
  .side-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 12px; box-shadow:0 2px 10px rgba(30,32,60,.06); position:sticky; top:12px;}
  .side-title{font-size:12px; font-weight:800; color:var(--sub); letter-spacing:.04em; padding:2px 8px 10px;}

  .lsearch{display:flex; align-items:center; gap:6px; background:#f5f4fb; border:1px solid var(--line); border-radius:12px; padding:7px 10px; margin:0 4px 10px;}
  .lsearch svg{width:15px; height:15px; stroke:var(--sub); fill:none; stroke-width:2; flex:none;}
  .lsearch input{border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--ink); font-family:inherit;}
  .lsearch input::placeholder{color:#b4b2c8;}

  .grp{margin-bottom:12px;}
  .grp:last-child{margin-bottom:2px;}
  .grp-label{font-size:11px; font-weight:800; color:#7a5cf0; letter-spacing:.04em; padding:4px 10px; display:flex; align-items:center; gap:6px;}
  .grp-label::before{content:""; width:8px; height:8px; border-radius:3px; background:var(--grad);}
  .doc{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:12px; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; transition:background .12s; margin:1px 0;}
  .doc svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.7; flex:none; opacity:.7;}
  .doc:hover{background:var(--grad-soft);}
  .doc.active{background:var(--grad); color:#fff;}
  .doc.active svg{opacity:1;}
  .doc.hidden{display:none;}
  .grp.hidden{display:none;}

  .lres{margin:4px 4px 0;}
  .lres-head{font-size:11px; font-weight:800; color:var(--sub); letter-spacing:.04em; padding:8px 8px 6px; border-top:1px dashed var(--line); margin-top:8px;}
  .lres-item{padding:8px 10px; border-radius:10px; cursor:pointer; margin:2px 0; background:#faf9fe; border:1px solid var(--line);}
  .lres-item:hover{background:var(--grad-soft);}
  .lres-doc{font-size:12px; font-weight:800; color:#5a54c8; display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .lres-pg{font-size:10.5px; font-weight:700; color:var(--sub); flex:none;}
  .lres-snip{font-size:11.5px; color:var(--ink); line-height:1.5; margin-top:3px; word-break:break-all;}
  .lres-snip mark{background:#ffe58a; color:inherit; border-radius:2px; padding:0 1px;}
  .lres-empty{font-size:12px; color:var(--sub); padding:8px 10px; line-height:1.6;}

  .viewer{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 2px 10px rgba(30,32,60,.06); overflow:hidden;}
  .vtop{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .vtitle{font-size:15px; font-weight:800; margin-right:auto; min-width:120px;}
  .search{display:flex; align-items:center; gap:6px; background:#f5f4fb; border:1px solid var(--line); border-radius:999px; padding:5px 6px 5px 12px;}
  .search svg{width:16px; height:16px; stroke:var(--sub); fill:none; stroke-width:2; flex:none;}
  .search input{border:none; background:transparent; outline:none; font-size:13.5px; width:180px; color:var(--ink); font-family:inherit;}
  .search input::placeholder{color:#b4b2c8;}
  .nav-btn{border:1px solid var(--line); background:#fff; width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:13px; color:#5a54c8; display:grid; place-items:center;}
  .nav-btn:hover{background:var(--grad-soft);}
  .nav-btn:disabled{opacity:.4; cursor:default;}
  .hit-count{font-size:12px; font-weight:700; color:var(--sub); min-width:96px; text-align:right;}

  .viewbox{flex:1; position:relative; background:#f3f2f8; min-height:360px;}
  #pdfScroll{position:absolute; inset:0; overflow:auto; padding:18px 0; display:flex; flex-direction:column; align-items:center; gap:14px;}
  .page{position:relative; box-shadow:0 2px 12px rgba(30,32,60,.14); background:#fff; border-radius:2px;}
  .page canvas{display:block; border-radius:2px;}

  .textLayer{position:absolute; left:0; top:0; right:0; bottom:0; overflow:hidden; line-height:1; opacity:1;}
  .textLayer > span{color:transparent; position:absolute; white-space:pre; transform-origin:0 0;}
  .textLayer mark{background:rgba(255,206,0,.45); color:transparent; border-radius:2px;}
  .textLayer mark.cur{background:rgba(255,132,0,.72);}

  .overlay{position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:30px; background:#f3f2f8; z-index:5;}
  .overlay.show{display:flex;}
  .overlay .box{max-width:420px;}
  .overlay .big{font-size:15px; font-weight:800; color:var(--ink); margin-bottom:6px;}
  .overlay .sub{font-size:13px; color:var(--sub); line-height:1.7;}
  .overlay code{background:#fff; border:1px solid var(--line); border-radius:6px; padding:1px 7px; font-size:12px;}

  .loading{position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:6; font-size:12px; font-weight:700; color:#5a54c8; background:#fff; border:1px solid var(--line); border-radius:999px; padding:5px 14px; box-shadow:0 2px 8px rgba(60,50,150,.1); display:none;}
  .loading.show{display:block;}

  @media (max-width:820px){
    .wrap{flex-direction:column; padding:4px 12px 20px;}
    .side{width:100%;}
    .side-card{position:static;}
    .search input{width:120px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">し</span>
    <span><b>しおどめ保育園三郷中央</b><small>規約・マニュアル</small></span>
  </div>
  <a class="back" href="https://kimkat01.github.io/shiodome-knowledge/">← ナレッジボードへ戻る</a>
</header>

<div class="wrap">
  <aside class="side">
    <div class="side-card">
      <div class="side-title">文書一覧</div>
      <div class="lsearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="lq" type="search" placeholder="文書名・本文をまとめて検索" autocomplete="off">
      </div>
      <div id="docList"></div>
      <div id="lresults" class="lres"></div>
    </div>
  </aside>

  <main class="viewer">
    <div class="vtop">
      <div class="vtitle" id="vtitle">読み込み中…</div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="この文書内を検索" autocomplete="off">
        <button class="nav-btn" id="prev" title="前の一致" disabled>&#8249;</button>
        <button class="nav-btn" id="next" title="次の一致" disabled>&#8250;</button>
      </div>
      <div class="hit-count" id="hits"></div>
    </div>
    <div class="viewbox">
      <div class="loading" id="loading">読み込み中…</div>
      <div id="pdfScroll"></div>
      <div class="overlay" id="ov"><div class="box">
        <div class="big" id="ovBig"></div>
        <div class="sub" id="ovSub"></div>
      </div></div>
    </div>
  </main>
</div>

<script src="./pdf.min.js"></script>
<script>
/* ===========================================================
   文書一覧（ジャンル分け）
   追加は該当グループの docs に1行足すだけ。
   title=表示名／file=PDFファイル名（半角英数字・小文字推奨）
   =========================================================== */
var GROUPS = [
  { label:"規約・マニュアル", docs:[
    { title:"就業規則（正規職員）",   file:"seiki-shugyo-kisoku.pdf" },
    { title:"就業規則（パート職員）", file:"part-shugyo-kisoku.pdf" },
    { title:"給与規定（正規職員）",   file:"seiki-kyuyo-kitei.pdf" },
    { title:"管理規程（法人）",       file:"kanri-kitei.pdf" },
    { title:"経理規程（法人）",       file:"keiri-kitei.pdf" }
  ]},
  { label:"BCP・防災", docs:[
    { title:"業務継続計画（BCP）", file:"misato-bcp.pdf" }
  ]},
  { label:"参考資料", docs:[
    { title:"こども性暴力防止法の施行について", file:"kodomo-seibouryoku-hou.pdf" }
  ]}
];

var PDFJS_WORKER = "./pdf.worker.min.js";
/* 日本語(CIDフォント)のテキスト抽出・検索に必須。無いと getTextContent が空になる。 */
var CMAP_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/";
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; }

var elList   = document.getElementById("docList");
var elTitle  = document.getElementById("vtitle");
var elScroll = document.getElementById("pdfScroll");
var elLoad   = document.getElementById("loading");
var ov       = document.getElementById("ov");
var ovBig    = document.getElementById("ovBig");
var ovSub    = document.getElementById("ovSub");
var elQ      = document.getElementById("q");
var elHits   = document.getElementById("hits");
var btnPrev  = document.getElementById("prev");
var btnNext  = document.getElementById("next");
var elLQ     = document.getElementById("lq");
var elLRes   = document.getElementById("lresults");

var ALLDOCS = [];
GROUPS.forEach(function(g){ g.docs.forEach(function(d){ ALLDOCS.push(d); }); });

var currentFile = "";
var renderToken = 0;      // 文書切替の世代管理
var cur = null;           // {pdf, pages:[rec], scale, token}
var io  = null;           // IntersectionObserver（遅延描画）
var matchList = [];       // 現在の検索一致 [{pi,occ}]（読み順）
var matchPtr  = -1;

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

/* ===== 左メニュー生成 ===== */
var docIcon = '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>';
GROUPS.forEach(function(g){
  var grp = document.createElement("div"); grp.className="grp"; g._grpEl=grp;
  var lab = document.createElement("div"); lab.className="grp-label"; lab.textContent=g.label;
  grp.appendChild(lab);
  g.docs.forEach(function(d){
    var item = document.createElement("div"); item.className="doc";
    item.innerHTML = docIcon + "<span>"+esc(d.title)+"</span>";
    item.addEventListener("click", function(){ openDoc(d, item); });
    grp.appendChild(item); d._el=item;
  });
  elList.appendChild(grp);
});

function setActive(el){
  document.querySelectorAll(".doc.active").forEach(function(n){ n.classList.remove("active"); });
  if(el) el.classList.add("active");
}
function showOverlay(big, sub){ ovBig.innerHTML=big; ovSub.innerHTML=sub||""; ov.classList.add("show"); }
function hideOverlay(){ ov.classList.remove("show"); }

/* ===== 文書を開く ===== */
function openDoc(d, el, opts){
  opts = opts || {};
  setActive(el || d._el);
  elTitle.textContent = d.title;
  currentFile = d.file;
  elQ.value = "";
  hideOverlay();
  return loadDoc(d.file, opts);
}

function computeScale(){
  var avail = elScroll.clientWidth - 24; if(avail<280) avail=280;
  var s = avail/595; if(s>2.0) s=2.0; if(s<0.6) s=0.6;   // A4幅(約595pt)基準
  return s;
}

/* テキストは全ページ先に抽出（軽い）→ canvasは遅延描画 */
function loadDoc(file, opts){
  var token = ++renderToken;
  elScroll.innerHTML = ""; resetSearchUI();
  if(io){ io.disconnect(); io=null; }
  cur = { pdf:null, pages:[], scale:computeScale(), token:token };
  if(!window.pdfjsLib){ showOverlay("PDFビューアを読み込めませんでした","ネットワーク接続をご確認ください。"); return Promise.resolve(false); }
  elLoad.classList.add("show");
  return pdfjsLib.getDocument({url:file, cMapUrl:CMAP_URL, cMapPacked:true}).promise.then(function(pdf){
    if(token!==renderToken) return false;
    cur.pdf = pdf;
    var chain = Promise.resolve();
    for(var p=1; p<=pdf.numPages; p++){
      (function(pn){
        chain = chain.then(function(){
          if(token!==renderToken) return;
          return pdf.getPage(pn).then(function(page){
            if(token!==renderToken) return;
            var vp = page.getViewport({scale:cur.scale});
            var div = document.createElement("div"); div.className="page";
            div.style.width  = Math.floor(vp.width)+"px";
            div.style.height = Math.floor(vp.height)+"px";
            div.setAttribute("data-idx", String(cur.pages.length));
            elScroll.appendChild(div);
            var rec = { page:page, vp:vp, div:div, rendered:false, spans:[], occMarks:[], hlq:null,
                        items:[], joined:"", joinedLow:"", starts:[], _p:null };
            cur.pages.push(rec);
            return page.getTextContent().then(function(tc){
              rec.items = tc.items.map(function(it){ return it.str||""; });
              rec.joined = rec.items.join("");
              rec.joinedLow = rec.joined.toLowerCase();
              rec.starts = new Array(rec.items.length);
              var off=0; for(var i=0;i<rec.items.length;i++){ rec.starts[i]=off; off+=rec.items[i].length; }
            });
          });
        });
      })(p);
    }
    return chain.then(function(){
      if(token!==renderToken) return false;
      elLoad.classList.remove("show");
      cur.textTotal = cur.pages.reduce(function(s,r){ return s+r.joined.length; },0);
      cur.noText = cur.textTotal < 30;   // 画像(スキャン)PDFは本文検索不可
      setupObserver(token);
      renderPageCanvas(0, token);
      renderPageCanvas(1, token);
      if(cur.noText) elHits.textContent = "画像PDF・検索非対応";
      if(opts.query){ elQ.value = opts.query; return doSearch().then(function(){ if(opts.page) jumpToPage(opts.page); return true; }); }
      if(elQ.value.trim()) doSearch();
      return true;
    });
  }).catch(function(){
    if(token!==renderToken) return false;
    elLoad.classList.remove("show");
    showOverlay("このPDFを表示できませんでした","リポジトリに <code>"+esc(file)+"</code> があるか、ファイル名をご確認ください。");
    return false;
  });
}

function setupObserver(token){
  io = new IntersectionObserver(function(ents){
    ents.forEach(function(e){
      if(e.isIntersecting){ renderPageCanvas(parseInt(e.target.getAttribute("data-idx"),10), token); }
    });
  }, { root:elScroll, rootMargin:"800px 0px" });
  cur.pages.forEach(function(rec){ io.observe(rec.div); });
}

/* 1ページを canvas + textLayer で描画（検索中ならハイライトも） */
function renderPageCanvas(idx, token){
  token = token || renderToken;
  var rec = cur && cur.pages[idx];
  if(!rec) return Promise.resolve();
  if(rec.rendered) return rec._p || Promise.resolve();
  if(token!==renderToken) return Promise.resolve();
  rec.rendered = true;
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  var canvas = document.createElement("canvas");
  canvas.width  = Math.floor(rec.vp.width*dpr);
  canvas.height = Math.floor(rec.vp.height*dpr);
  canvas.style.width  = Math.floor(rec.vp.width)+"px";
  canvas.style.height = Math.floor(rec.vp.height)+"px";
  var ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr);
  rec.div.appendChild(canvas);
  var tl = document.createElement("div"); tl.className="textLayer";
  tl.style.width  = Math.floor(rec.vp.width)+"px";
  tl.style.height = Math.floor(rec.vp.height)+"px";
  tl.style.setProperty("--scale-factor", String(cur.scale));
  rec.div.appendChild(tl);
  rec._p = rec.page.render({canvasContext:ctx, viewport:rec.vp}).promise.then(function(){
    if(token!==renderToken) return;
    return rec.page.getTextContent();
  }).then(function(tc){
    if(!tc || token!==renderToken) return;
    var textDivs = [];
    return pdfjsLib.renderTextLayer({ textContentSource:tc, container:tl, viewport:rec.vp, textDivs:textDivs }).promise.then(function(){
      rec.spans = textDivs;
      if(io) io.unobserve(rec.div);
      var q = elQ.value.trim(); if(q) highlightPage(rec, q);
    });
  }).catch(function(){});
  return rec._p;
}

/* ===== この文書内を検索：語をハイライトしてその語へジャンプ ===== */
var searchTimer=null;
elQ.addEventListener("input", function(){ clearTimeout(searchTimer); searchTimer=setTimeout(doSearch,200); });
elQ.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); gotoMatch(matchPtr+1); } });
btnPrev.addEventListener("click", function(){ gotoMatch(matchPtr-1); });
btnNext.addEventListener("click", function(){ gotoMatch(matchPtr+1); });

function resetSearchUI(){
  matchList=[]; matchPtr=-1; elHits.textContent="";
  btnPrev.disabled=btnNext.disabled=true;
  if(cur){ cur.pages.forEach(function(rec){ clearPageHl(rec); }); }
}
function clearPageHl(rec){
  if(rec.hlq==null) return;
  for(var i=0;i<rec.spans.length;i++){ var sp=rec.spans[i]; if(sp.__orig!=null) sp.textContent=sp.__orig; }
  rec.occMarks=[]; rec.hlq=null;
}
/* ページ連結テキストから出現位置（開始オフセット）を列挙。断片(item)をまたぐ語も拾える */
function pageOccurrences(rec, ql){
  var occ=[]; if(!rec.joinedLow) return occ;
  var from=0, at;
  while((at=rec.joinedLow.indexOf(ql,from))!==-1){ occ.push(at); from=at+ql.length; }
  return occ;
}
/* 1ページを検索語でハイライト（1語が複数spanにまたがっても全span着色） */
function highlightPage(rec, q){
  if(rec.hlq===q) return;
  clearPageHl(rec);
  rec.occMarks=[];
  if(!rec.spans.length || !q){ rec.hlq=q; return; }
  var ql=q.toLowerCase(), n=ql.length;
  var occ=pageOccurrences(rec, ql);
  if(!occ.length){ rec.hlq=q; return; }
  rec.occMarks = occ.map(function(){ return []; });
  var perSpan={};   // spanIndex -> [{a,b,occ}]
  occ.forEach(function(s, oi){
    var e=s+n;
    for(var j=0;j<rec.items.length;j++){
      var js=rec.starts[j], je=js+rec.items[j].length;
      if(je<=s) continue; if(js>=e) break;
      var a=Math.max(s,js)-js, b=Math.min(e,je)-js;
      if(b>a){ (perSpan[j]||(perSpan[j]=[])).push({a:a,b:b,occ:oi}); }
    }
  });
  Object.keys(perSpan).forEach(function(js){
    var j=parseInt(js,10), span=rec.spans[j];
    if(!span) return;
    var text=(span.__orig!=null)?span.__orig:span.textContent; span.__orig=text;
    var ivs=perSpan[j].sort(function(x,y){ return x.a-y.a; });
    var html="", pos=0;
    ivs.forEach(function(iv){
      if(iv.a>pos) html+=esc(text.slice(pos,iv.a));
      html+='<mark data-occ="'+iv.occ+'">'+esc(text.slice(iv.a,iv.b))+'</mark>';
      pos=iv.b;
    });
    html+=esc(text.slice(pos));
    span.innerHTML=html;
    span.querySelectorAll("mark").forEach(function(mk){
      var oi=parseInt(mk.getAttribute("data-occ"),10);
      if(rec.occMarks[oi]) rec.occMarks[oi].push(mk);
    });
  });
  rec.hlq=q;
}
function doSearch(){
  var q = elQ.value.trim();
  matchList=[]; matchPtr=-1;
  if(cur) cur.pages.forEach(function(rec){ clearPageHl(rec); });
  if(!q || !cur){ elHits.textContent = (cur&&cur.noText)?"画像PDF・検索非対応":""; btnPrev.disabled=btnNext.disabled=true; return Promise.resolve(); }
  if(cur.noText){ elHits.textContent="この文書は画像PDFのため検索できません"; btnPrev.disabled=btnNext.disabled=true; return Promise.resolve(); }
  var ql=q.toLowerCase();
  cur.pages.forEach(function(rec,pi){ var occ=pageOccurrences(rec,ql); for(var k=0;k<occ.length;k++) matchList.push({pi:pi, k:k}); });
  // すでに描画済みのページは即ハイライト
  cur.pages.forEach(function(rec){ if(rec.spans.length) highlightPage(rec,q); });
  if(!matchList.length){ elHits.textContent="該当なし"; btnPrev.disabled=btnNext.disabled=true; return Promise.resolve(); }
  btnPrev.disabled=btnNext.disabled=false;
  return gotoMatch(0);
}
function gotoMatch(i){
  if(!matchList.length) return Promise.resolve();
  matchPtr = ((i % matchList.length) + matchList.length) % matchList.length;
  var m = matchList[matchPtr]; var rec = cur.pages[m.pi];
  elHits.textContent = (matchPtr+1)+" / "+matchList.length+" 件";
  return Promise.resolve(renderPageCanvas(m.pi)).then(function(){
    highlightPage(rec, elQ.value.trim());
    var prevs = elScroll.querySelectorAll(".textLayer mark.cur");
    for(var x=0;x<prevs.length;x++) prevs[x].classList.remove("cur");
    var marks = rec.occMarks[m.k] || [];
    for(var y=0;y<marks.length;y++) marks[y].classList.add("cur");
    if(marks[0]) marks[0].scrollIntoView({block:"center", behavior:"smooth"});
    else rec.div.scrollIntoView({block:"start", behavior:"smooth"});
  });
}
function jumpToPage(pageNum){
  for(var k=0;k<matchList.length;k++){ if(matchList[k].pi===pageNum-1){ gotoMatch(k); return; } }
}

/* ===== 左カラム：名前絞り込み ＋ 全文書 横断検索 ===== */
var docIndex = {};        // file -> [pageText,...]
var indexReady = false;
var indexBuilding = false;
var lqTimer=null;

elLQ.addEventListener("input", function(){ clearTimeout(lqTimer); lqTimer=setTimeout(onLeftSearch,200); });
elLQ.addEventListener("focus", function(){ ensureIndex(); });

function onLeftSearch(){
  var q = elLQ.value.trim();
  filterDocNames(q);
  if(!q){ elLRes.innerHTML=""; return; }
  ensureIndex();
  renderCrossResults(q);
}
function filterDocNames(q){
  var ql=q.toLowerCase();
  GROUPS.forEach(function(g){
    var anyVisible=false;
    g.docs.forEach(function(d){
      var hit = !ql || d.title.toLowerCase().indexOf(ql)!==-1;
      d._el.classList.toggle("hidden", !hit);
      if(hit) anyVisible=true;
    });
    g._grpEl.classList.toggle("hidden", !anyVisible);
  });
}
function ensureIndex(){
  if(indexReady || indexBuilding || !window.pdfjsLib) return;
  indexBuilding = true;
  var chain = Promise.resolve();
  ALLDOCS.forEach(function(d){
    chain = chain.then(function(){
      if(docIndex[d.file]) return;
      return pdfjsLib.getDocument({url:d.file, cMapUrl:CMAP_URL, cMapPacked:true}).promise.then(function(pdf){
        var texts = new Array(pdf.numPages);
        var sub = Promise.resolve();
        for(var p=1;p<=pdf.numPages;p++){
          (function(pn){
            sub = sub.then(function(){
              return pdf.getPage(pn).then(function(pg){ return pg.getTextContent(); })
                .then(function(tc){ texts[pn-1]=tc.items.map(function(it){return it.str||"";}).join(""); })
                .catch(function(){ texts[pn-1]=""; });
            });
          })(p);
        }
        return sub.then(function(){ docIndex[d.file]=texts; });
      }).catch(function(){ docIndex[d.file]=[]; });
    });
  });
  chain.then(function(){
    indexReady=true; indexBuilding=false;
    if(elLQ.value.trim()) renderCrossResults(elLQ.value.trim());
  });
}
function renderCrossResults(q){
  var ql=q.toLowerCase();
  if(!indexReady){
    elLRes.innerHTML = '<div class="lres-head">本文から</div><div class="lres-empty">全文検索を準備中です…</div>';
    return;
  }
  var hits=[];
  for(var a=0;a<ALLDOCS.length;a++){
    var d=ALLDOCS[a], pages=docIndex[d.file]||[];
    for(var p=0;p<pages.length;p++){
      var low=(pages[p]||"").toLowerCase(), at=low.indexOf(ql);
      if(at!==-1){ hits.push({ doc:d, page:p+1, snippet:makeSnippet(pages[p], at, q.length) }); }
      if(hits.length>=40) break;
    }
    if(hits.length>=40) break;
  }
  if(hits.length===0){
    elLRes.innerHTML = '<div class="lres-head">本文から</div><div class="lres-empty">本文に該当はありません。</div>';
    return;
  }
  var html='<div class="lres-head">本文から（'+hits.length+(hits.length>=40?"件以上":"件")+'）</div>';
  hits.forEach(function(h,idx){
    html += '<div class="lres-item" data-i="'+idx+'">'
         +  '<div class="lres-doc"><span>'+esc(h.doc.title)+'</span><span class="lres-pg">P'+h.page+'</span></div>'
         +  '<div class="lres-snip">'+h.snippet+'</div></div>';
  });
  elLRes.innerHTML = html;
  elLRes.querySelectorAll(".lres-item").forEach(function(it){
    it.addEventListener("click", function(){
      var h = hits[parseInt(it.getAttribute("data-i"),10)];
      openDoc(h.doc, h.doc._el, {query:q, page:h.page});
    });
  });
}
function makeSnippet(text, at, len){
  var start=Math.max(0, at-18), end=Math.min(text.length, at+len+22);
  var pre=(start>0?"…":"")+text.slice(start,at);
  var hit=text.slice(at,at+len);
  var post=text.slice(at+len,end)+(end<text.length?"…":"");
  return esc(pre)+"<mark>"+esc(hit)+"</mark>"+esc(post);
}

/* ===== 画面幅変更時は現在の文書を作り直す ===== */
window.addEventListener("resize", function(){
  clearTimeout(window.__rz); window.__rz=setTimeout(function(){
    var d = ALLDOCS.filter(function(x){ return x.file===currentFile; })[0];
    if(d){ var q=elQ.value; loadDoc(d.file,{}).then(function(ok){ if(ok&&q){ elQ.value=q; doSearch(); } }); }
  },350);
});

/* ===== 初期表示：先頭の文書を開く ===== */
(function(){ var f=GROUPS[0]&&GROUPS[0].docs[0]; if(f) openDoc(f, f._el); })();
</script>
