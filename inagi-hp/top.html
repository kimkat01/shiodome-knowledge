<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しおどめ保育園稲城 TOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ★ここだけ書き換えればOK（色・画像・文字）
   ========================================================= */
:root{
  --bg:      #fdf8f2;   /* ページの地色（くり抜き部分の色）。Wixの背景色と同じにする */
  --main:    #2f8f5b;   /* メインカラー（ボタン・日付など） */
  --main-dk: #237046;   /* ボタンにマウスを乗せた時の色 */
  --text:    #3a2e28;   /* 文字色 */
  --r: clamp(20px, 3vw, 44px);              /* 角の丸さ（画面幅で自動調整） */
  /* 動画のURLは下の <video> の src に書きます（このファイル内で「ここに動画のURL」を検索） */
}
/* ========================================================= */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:"Tsukushi A Round Gothic","筑紫A丸ゴシック","TsukuARdGothic-Regular","Zen Maru Gothic",sans-serif;color:var(--text)}
a{color:inherit;text-decoration:none}

/* 全体：iframeの高さいっぱいに広がる */
.wrap{position:relative;height:100%;min-height:480px;padding:clamp(12px,2.2vw,32px)}
.hero{position:relative;width:100%;height:100%}

/* 写真（角丸） */
.photo{
  position:absolute;inset:0;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(135deg,#9cc9a8,#e8d9b8); /* 動画が読み込まれるまでの仮の色 */
}
.photo video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;               /* 画面の形が変わっても隙間なく埋める */
  display:block;
}
.photo::after{ /* 文字を読みやすくする薄い影 */
  content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,.08) 55%,rgba(0,0,0,.18));
}

/* ---------- 左上：ロゴのくり抜き ---------- */
.logo-tab{
  position:absolute;left:0;top:0;z-index:3;
  width:clamp(230px,27vw,500px);height:clamp(72px,8.5vw,150px);
  background:var(--bg);border-bottom-right-radius:var(--r);
  display:flex;align-items:center;padding:0 clamp(10px,1.6vw,26px) 0 clamp(2px,.4vw,8px);
}
.logo-tab img{width:100%;height:auto;max-height:82%;object-fit:contain;object-position:left center;display:block}
.logo-tab .logo-text{font-weight:900;font-size:clamp(18px,2.4vw,40px);color:var(--main);line-height:1.15}
.logo-tab .logo-text small{display:block;font-size:.45em;font-weight:700;letter-spacing:.15em}
/* 内側に丸くなる角（2か所） */
.logo-tab::before,.logo-tab::after{
  content:"";position:absolute;width:var(--r);height:var(--r);
  background:radial-gradient(circle at 100% 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r));
}
.logo-tab::before{left:100%;top:0}
.logo-tab::after{left:0;top:100%}

/* ---------- 右上：メニュー ---------- */
.nav{
  position:absolute;top:clamp(14px,2vw,36px);right:clamp(14px,2vw,36px);z-index:4;
  display:flex;align-items:center;gap:clamp(14px,1.8vw,34px);
}
.nav a.item{color:#fff;font-weight:700;font-size:clamp(13px,1.05vw,17px);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.nav a.item:hover{opacity:.75}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--main);color:#fff;font-weight:700;border-radius:calc(var(--r) * .55);
  padding:clamp(12px,1.4vw,24px) clamp(18px,2vw,40px);font-size:clamp(13px,1.1vw,18px);
  transition:background .2s;
}
.btn:hover{background:var(--main-dk)}

/* ---------- キャッチコピー ---------- */
.catch{
  position:absolute;z-index:2;color:#fff;font-weight:700;
  left:clamp(24px,5.5vw,120px);bottom:clamp(110px,10vw,170px);
  font-size:clamp(26px,3.3vw,60px);line-height:1.55;letter-spacing:.06em;
  text-shadow:0 2px 12px rgba(0,0,0,.35);
}

/* ---------- 縦書き英字 ---------- */
.vertical{
  position:absolute;z-index:2;right:clamp(10px,1.5vw,24px);top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;color:#fff;font-size:clamp(10px,.8vw,13px);letter-spacing:.2em;font-weight:700;
}

/* ---------- 右下：Pick Up ---------- */
.pickup{
  position:absolute;right:0;bottom:0;z-index:3;
  width:clamp(320px,31vw,640px);
  background:var(--bg);border-top-left-radius:var(--r);
  padding:clamp(14px,1.6vw,28px) 0 0 clamp(16px,1.8vw,32px);
  display:flex;align-items:center;gap:clamp(12px,1.4vw,26px);
}
.pickup::before,.pickup::after{
  content:"";position:absolute;width:var(--r);height:var(--r);
  background:radial-gradient(circle at 0 0,transparent calc(var(--r) - .5px),var(--bg) var(--r));
}
.pickup::before{right:100%;bottom:0}
.pickup::after{right:0;bottom:100%}
.pickup .tag{flex-shrink:0;padding:clamp(10px,.9vw,16px) clamp(14px,1.4vw,26px);border-radius:12px;font-size:clamp(13px,1vw,17px)}
.pickup .info{min-width:0}
.pickup .date{color:var(--main);font-size:clamp(12px,.9vw,15px);font-weight:700}
.pickup .title{font-weight:700;font-size:clamp(14px,1.05vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickup a:hover .title{text-decoration:underline}

/* ---------- ハンバーガー（スマホ用） ---------- */
.menu-btn{
  display:none;position:absolute;z-index:6;top:10px;right:10px;
  width:58px;height:58px;border:none;border-radius:16px;background:var(--main);cursor:pointer;
}
.menu-btn span{position:absolute;left:18px;width:22px;height:2px;background:#fff;transition:.25s}
.menu-btn span:nth-child(1){top:23px}.menu-btn span:nth-child(2){top:33px}
.menu-open .menu-btn span:nth-child(1){top:28px;transform:rotate(45deg)}
.menu-open .menu-btn span:nth-child(2){top:28px;transform:rotate(-45deg)}
.sp-menu{
  position:fixed;inset:0;z-index:5;background:rgba(253,248,242,.97);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.sp-menu a{font-size:18px;font-weight:700}
.menu-open .sp-menu{opacity:1;pointer-events:auto}

/* =========================================================
   タブレット以下
   ========================================================= */
@media (max-width:1100px){
  .nav a.item{display:none}            /* 文字メニューを隠してボタンだけ残す */
}
/* スマホ */
@media (max-width:767px){
  .wrap{padding:12px}
  .nav{display:none}
  .menu-btn{display:block}
  .logo-tab{width:74%;height:76px}
  .catch{left:auto;right:22px;bottom:150px;text-align:right;font-size:clamp(19px,5.4vw,28px)}
  .vertical{right:auto;left:14px;top:38%;}
  .pickup{
    left:14px;right:14px;width:auto;bottom:0;
    background:#fff;border-radius:var(--r) var(--r) 0 0;
    flex-direction:column;align-items:flex-start;gap:10px;padding:16px 20px 18px;
  }
  .pickup::before,.pickup::after{display:none}
  .pickup .title{white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hero">
    <div class="photo">
      <!-- ★動画：src を動画（mp4）のURLに書き換える。音なし・自動再生・くり返し -->
      <video autoplay muted loop playsinline preload="auto"
             poster="https://kimkat01.github.io/shiodome-knowledge/inagi-hp/poster.jpg"
             src="https://kimkat01.github.io/shiodome-knowledge/inagi-hp/top.mp4"></video>
    </div>

    <!-- 左上ロゴ：ロゴ画像があれば <img> に差し替え（下のコメント参照） -->
    <a class="logo-tab" href="/" target="_top">
      <img src="https://kimkat01.github.io/shiodome-knowledge/inagi-hp/logo.png" alt="学校法人柴学園 しおどめ保育園稲城">
    </a>

    <!-- 右上メニュー（PC）：リンク先を書き換え -->
    <nav class="nav">
      <a class="item" href="/about" target="_top">園の紹介</a>
      <a class="item" href="/hoiku" target="_top">保育の特徴</a>
      <a class="item" href="/day" target="_top">一日の流れ</a>
      <a class="item" href="/nyuen" target="_top">入園案内</a>
      <a class="item" href="/recruit" target="_top">採用情報</a>
      <a class="item" href="/news" target="_top">お知らせ</a>
      <a class="btn"  href="/contact" target="_top">お問い合わせ</a>
    </nav>

    <h1 class="catch">子どもの「やってみたい」を<br>まんなかに。</h1>

    <div class="vertical">SHIODOME HOIKUEN INAGI</div>

    <!-- 右下 Pick Up -->
    <div class="pickup">
      <a class="btn tag" href="/news" target="_top">Pick Up</a>
      <a class="info" href="/news" target="_top">
        <div class="date">2026.11.20</div>
        <div class="title">ホームページをリニューアルいたしました</div>
      </a>
    </div>

    <!-- スマホ用メニュー（PCと同じリンクにする） -->
    <button class="menu-btn" aria-label="メニュー" onclick="document.getElementById('wrap').classList.toggle('menu-open')"><span></span><span></span></button>
    <div class="sp-menu">
      <a href="/about" target="_top">園の紹介</a>
      <a href="/hoiku" target="_top">保育の特徴</a>
      <a href="/day" target="_top">一日の流れ</a>
      <a href="/nyuen" target="_top">入園案内</a>
      <a href="/recruit" target="_top">採用情報</a>
      <a href="/news" target="_top">お知らせ</a>
      <a class="btn" href="/contact" target="_top">お問い合わせ</a>
    </div>
  </div>
</div>
<script>
  // 一部のスマホで自動再生が止まる場合の保険
  var v=document.querySelector('.photo video');
  if(v){v.muted=true;var p=v.play();if(p&&p.catch){p.catch(function(){});}}
</script>
</body>
</html>
